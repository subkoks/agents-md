name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2155

      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: "**/*.md"

  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Validate rules structure
        run: ./scripts/validate-rules.sh

      - name: Comprehensive validation
        run: ./scripts/validate-comprehensive.sh --strict

      - name: Check markdown links
        run: ./scripts/check-links.sh

      - name: Check rule drift (pre-build)
        run: ./scripts/check-local-drift.sh

      - name: Check skill registry drift
        run: ./scripts/check-skill-registry-drift.sh

  build:
    name: build
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build artifacts (dry run)
        run: ./scripts/build-rule-artifacts.sh --dry-run --verbose

      - name: Build artifacts
        run: ./scripts/build-rule-artifacts.sh --force --verbose

      - name: Strict drift check
        run: ./scripts/check-local-drift.sh --strict

      - name: Build structured rule artifacts
        run: ./scripts/build-structured-rules.sh --verbose

      - name: Structured rules drift check
        run: ./scripts/build-structured-rules.sh --check

      - name: Verify all artifacts exist
        run: |
          test -f dist/rules/windsurf.md
          test -f dist/rules/claude.md
          test -f dist/rules/cursor.md
          test -f dist/rules/cursor.lean.md
          test -f dist/rules/gotcha.rules.json
          test -f dist/rules/gotcha.rules.tsv

  test:
    name: test
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Make scripts executable
        run: chmod +x scripts/*.sh install.sh

      - name: Run bats suite
        run: bats tests/

  security-scan:
    name: security-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

      - name: Config security scan (blocking on high+)
        run: |
          chmod +x scripts/security-scan.sh
          ./scripts/security-scan.sh --format markdown --fail-on high | tee -a "$GITHUB_STEP_SUMMARY"
